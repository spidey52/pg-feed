version: 2
project_name: pg-feed
builds:
  - main: ./cmd/pg-feed
    binary: pg-feed
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, config.example.yaml]
checksum:
  name_template: checksums.txt
changelog:
  use: github
release:
  draft: false
